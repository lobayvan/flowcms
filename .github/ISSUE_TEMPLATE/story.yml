name: User story
description: Nouvelle story (à reporter ensuite dans backlog/backlog.json)
labels: ["story"]
body:
  - type: input
    id: id
    attributes: { label: Identifiant, placeholder: "US-0xx" }
    validations: { required: true }
  - type: textarea
    id: story
    attributes:
      label: Story
      value: "En tant que <persona>, je veux <action> afin de <bénéfice>."
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: 2 à 6 critères vérifiables par un test
      value: "- [ ] \n- [ ] "
    validations: { required: true }
  - type: dropdown
    id: points
    attributes: { label: Estimation, options: ["1", "2", "3", "5", "8"] }
  - type: input
    id: journey
    attributes: { label: Parcours UX (si label ux), placeholder: "J2" }
